# Nero host landlord runtime dirs — install as /etc/tmpfiles.d/nero-host.conf:
#   sudo cp deploy/tmpfiles/nero-host.conf /etc/tmpfiles.d/nero-host.conf
#   sudo systemd-tmpfiles --create /etc/tmpfiles.d/nero-host.conf
#
# /run is tmpfs: without this entry a reboot recreates /run/nero/w as
# root:root 0700 (the landlord unit's UMask=0077) and Caddy can never
# traverse to the workspace sockets — every /w/:id route 502s. nero-host.service
# also self-heals the mode at start; this file makes it correct from boot.
# Type Path         Mode User Group Age Argument
d     /run/nero    0755 root  root  -   -
d     /run/nero/w  0750 root  caddy -   -
