<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>grogan.dev</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #0b0b0c;
      color: #e8e8ea;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-weight: 600; letter-spacing: -0.03em; margin: 0 0 0.5rem; font-size: 1.75rem; }
    p { color: #9a9aa3; margin: 0 0 1.75rem; }
    a.portal {
      display: inline-block;
      padding: 0.7rem 1.25rem;
      background: #e8e8ea;
      color: #0b0b0c;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
    a.portal:hover { background: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>grogan.dev</h1>
    <p>Nero workspaces</p>
    <a class="portal" href="/auth/login">Open portal</a>
  </main>
</body>
</html>
